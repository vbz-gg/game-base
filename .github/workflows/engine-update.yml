name: Engine update

# Opens a pull request when clockwork2 publishes a new @clockwork2/engine.
#
# It asks the registry rather than listening to clockwork2. A repository
# dispatch from there would need a token with write access to this one, which
# is the sort of long-lived credential the release workflow exists to avoid,
# and it would only fire for a release cut that particular way. The registry is
# the thing this package actually depends on, so asking it catches a release
# however it was published - from the workflow, or from somebody's laptop.
#
# What it cannot do is give its own pull request a CI run. A pull request
# opened with GITHUB_TOKEN starts no workflow, so the checks a reviewer looks
# for never appear on it. The gate therefore runs here, before the pull request
# is opened, and the result goes in the body with a link to this run. A red
# gate still opens the pull request: "the new engine breaks us" is the most
# useful version of this notification, not a reason to stay quiet.

on:
  schedule:
    # Daily, a few minutes off the hour so it does not land with everything
    # else the platform runs at :00.
    - cron: "17 6 * * *"
  workflow_dispatch:

env:
  # Who gets the pull request. One line to change, and the only place a person
  # is named in this repository's automation.
  REVIEWER: hiddentao

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: What the registry has
        id: engine
        run: |
          set -euo pipefail
          latest="$(npm view @clockwork2/engine version)"
          current="$(node -p "require('./package.json').devDependencies['@clockwork2/engine']")"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$current" ]; then
            echo "up to date on $current"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$current -> $latest"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A branch per version, so a run that lands while the last pull request
      # is still open does not open a second one for the same release.
      - name: Is there already a pull request for it
        id: existing
        if: steps.engine.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="engine/${{ steps.engine.outputs.latest }}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          if [ -n "$(gh pr list --head "$branch" --state all --json number --jq '.[].number')" ]; then
            echo "there is already a pull request for $branch"
            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump it
        if: steps.engine.outputs.changed == 'true' && steps.existing.outputs.open == 'false'
        run: |
          set -euo pipefail
          bun run scripts/bump-engine.ts "${{ steps.engine.outputs.latest }}"
          bun install

      # Not `--frozen-lockfile` above, because the bump is what changes the
      # lockfile. This is the gate a reviewer would otherwise read off the
      # pull request's checks, and it does not stop the job: a failure is the
      # finding, and it goes in the body.
      - name: Would it still pass
        id: gate
        if: steps.engine.outputs.changed == 'true' && steps.existing.outputs.open == 'false'
        continue-on-error: true
        run: |
          set -euo pipefail
          bun run lint
          bun run build
          bun run typecheck
          bun run test:coverage
          bun run check:publishable

      - name: Open the pull request
        if: steps.engine.outputs.changed == 'true' && steps.existing.outputs.open == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.existing.outputs.branch }}
          FROM: ${{ steps.engine.outputs.current }}
          TO: ${{ steps.engine.outputs.latest }}
          GATE: ${{ steps.gate.outcome }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          # The hooks are installed by `bun install`, so this message has to
          # satisfy commitlint and carry the Docs-Updated trailer, exactly as a
          # hand-written one does. It is true: bump-engine.ts rewrites the
          # range docs/sdk.md quotes.
          git commit -q -F - <<MESSAGE
          build(deps): engine $TO

          Opened by .github/workflows/engine-update.yml, which asks the
          registry once a day. $FROM -> $TO, and the peer range with it.

          Docs-Updated: sdk.md's peer range is rewritten by scripts/bump-engine.ts
          MESSAGE
          git push origin "$BRANCH"

          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$GATE" = "success" ]; then
            verdict="The gate passed on the bumped tree: lint, build, typecheck, the coverage floor and the pack check."
          else
            verdict="**The gate failed on the bumped tree.** That is the finding: this engine release changes something this package depends on."
          fi

          gh pr create \
            --base "${GITHUB_REF_NAME}" \
            --head "$BRANCH" \
            --title "build(deps): engine $TO" \
            --body "$(cat <<BODY
          \`@clockwork2/engine\` $FROM -> $TO, with the peer range and every other place the version is written, through \`scripts/bump-engine.ts\`.

          $verdict

          [The run that opened this]($run)

          GitHub starts no workflow for a pull request opened with \`GITHUB_TOKEN\`, so this one carries no checks of its own. Pushing any commit to the branch gives it real ones.
          BODY
          )"

      - name: Ping the reviewer
        if: steps.engine.outputs.changed == 'true' && steps.existing.outputs.open == 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.existing.outputs.branch }}
        run: gh pr edit "$BRANCH" --add-reviewer "$REVIEWER" --add-assignee "$REVIEWER"
