# Coverage settings for `bun test --coverage`.
#
# None of this affects `bun run test`, which does not pass --coverage. The
# everyday command stays as fast as it was; the gate is `bun run test:coverage`.

[test]
coverageSkipTestFiles = true
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"

# What is measured is `packages/*/src`. Everything below is either not the
# code under test or cannot be measured in process.
#
# fixtures/ holds small games the harness and the browser suite drive. They
# are inputs rather than code under test, and how much of one runs says
# nothing about this package.
#
# e2e is the Playwright suite and scripts is the repository's own tooling.
coveragePathIgnorePatterns = [
  "packages/*/dist/**",
  # A process entry point. Its last statement runs `main`, so importing it
  # into the test runner would start a server and never return. What it
  # decides is `parseArgs`, which is exported and tested.
  "packages/game-base/src/cli/index.ts",
  # The harness page's own script. It reads `document` at module scope and
  # wires itself to a live frame, so importing it into the runner starts
  # nothing and measures nothing. What it decides - which layout the picker
  # draws, which binding goes with it, when a recording is whole - is checked
  # by the browser suite, which drives the page it builds. Listed rather than
  # left out, so that it is a decision rather than a file nobody loaded.
  "packages/game-base/src/harness/page/main.ts",
  "fixtures/**",
  "templates/**",
  "e2e/**",
  "scripts/**",
  # The template and the fixture, built to a temp directory and loaded by the
  # conformance suite. They are the subjects under test rather than this
  # package's code, and how much of a game runs during a determinism check
  # says nothing about game-base. They also arrive with a fresh random name
  # every run, as `../../../tmp/game-base-conformance-1hN9V6/index.js`.
  "**/game-base-conformance-*/**",
]

# No `coverageThreshold` here on purpose, and adding one back is a mistake.
#
# Two reasons, both measured on bun 1.3.11. Bun applies it per file rather
# than to the `All files` row, so 0.99 here would demand 99% of every file,
# which for a file under a hundred executable lines means 100%. And the keys
# have to be plural: the singular `line` and `function` are accepted, ignored
# and never fire, so a run at 33% exits 0 while reading as a gate.
#
# The floor lives in scripts/check-coverage.ts, which reads coverage/lcov.info
# and holds the aggregate to 99% of lines. A failure there prints the
# shortfall in lines and the worst files, rather than one line about whichever
# file bun happened to check first.
